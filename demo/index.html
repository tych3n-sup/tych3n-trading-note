<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00382A">
<meta name="color-scheme" content="dark">
<title>tych3n trading note</title>
<meta name="description" content="tych3n trading note 主選單：週報與直播連結。">
<meta property="og:title" content="tych3n trading note">
<meta property="og:description" content="週報與直播連結。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tych3n-sup.github.io/tych3n-trading-note/demo/">
<meta property="og:image" content="https://tych3n-sup.github.io/tych3n-trading-note/demo/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://tych3n-sup.github.io/tych3n-trading-note/demo/">
<style>
@font-face{font-family:"Cormorant Garamond";src:url(./assets/fonts/cormorant.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:block}
@font-face{font-family:"Cormorant Garamond";src:url(./assets/fonts/cormorant-italic.woff2) format("woff2");font-weight:300 700;font-style:italic;font-display:block}
@font-face{font-family:"TT Serif TC";src:url(./assets/fonts/notoserif-tc.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:block}
@font-face{font-family:"TT Sans TC";src:url(./assets/fonts/notosans-tc.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:block}
:root{--deep:#00382A;--night:#00261C;--line-g:#2F5A4C;--sage:#8FA89C;--mist:#A9BDB2;--ivory:#F4F1EA;--champ:#C9A14A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(ellipse at 50% 0%,#00432F 0%,var(--deep) 50%,var(--night) 100%) fixed;background-color:var(--night);color:var(--ivory);font-family:"TT Sans TC",Georgia,serif}
body{padding:48px 20px 72px;padding-top:max(48px,env(safe-area-inset-top));padding-bottom:max(72px,env(safe-area-inset-bottom))}
.wrap{width:min(440px,100%);margin:0 auto}
.brand{text-align:center;margin-bottom:42px}
.logo{width:86px;height:auto;margin:0 auto 18px;display:block}
.m-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(32px,11vw,44px);letter-spacing:.46em;margin-right:-.46em;line-height:1;color:var(--ivory)}
.m-sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:400;font-size:20px;color:var(--champ);margin-top:6px;letter-spacing:.06em}
.hair{display:block;width:42px;height:1px;background:var(--champ);margin:16px auto 0;border:0}
.sec{margin-top:28px}
.sec-h{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--champ);padding-bottom:10px;border-bottom:.5px solid var(--champ)}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.slot{
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  min-height:56px;padding:14px 16px;
  border:.5px solid var(--line-g);color:var(--ivory);text-decoration:none;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(201,161,74,.2);
}
a.slot:focus,a.slot:hover{border-color:var(--champ);color:var(--ivory)}
.slot-soon{border-style:solid;border-color:var(--line-g);color:var(--sage);text-align:center}
.slot-t{font-family:"TT Serif TC",serif;font-weight:300;font-size:17px;letter-spacing:.06em}
.slot-soon .slot-t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:13px;letter-spacing:.28em;color:var(--sage)}
.meta{font-family:"Cormorant Garamond",Georgia,serif;font-size:12px;letter-spacing:.08em;color:var(--mist)}
.door{
  display:block;margin-top:14px;padding:20px 18px;min-height:88px;
  border:.5px solid var(--champ);color:var(--ivory);text-decoration:none;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(201,161,74,.2);
}
.door:focus,.door:hover{background:rgba(201,161,74,.06)}
.door .slot-t{font-size:22px;letter-spacing:.12em}
.door .hint{display:block;margin-top:6px;font-size:13.5px;color:var(--mist);letter-spacing:.06em}
.door .meta{display:block;margin-top:10px;letter-spacing:.04em}
.foot{text-align:center;margin-top:48px;color:var(--sage);letter-spacing:.12em;font-size:12px}
</style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <img class="logo" src="./assets/logo.webp" alt="tych3n">
      <div class="m-name">TYCH3N</div>
      <div class="m-sub">trading note</div>
      <i class="hair"></i>
    </header>
    <section class="sec" aria-labelledby="live-h">
      <h2 class="sec-h" id="live-h">直播連結</h2>
      <div class="slots">
        <div class="slot slot-soon" aria-disabled="true"><span class="slot-t">即將更新</span></div><div class="slot slot-soon" aria-disabled="true"><span class="slot-t">即將更新</span></div><div class="slot slot-soon" aria-disabled="true"><span class="slot-t">即將更新</span></div>
      </div>
    </section>
    <section class="sec" aria-labelledby="week-h">
      <h2 class="sec-h" id="week-h">週報</h2>
      <a class="door" href="./weekly/">
        <span class="slot-t">週報</span>
        <span class="hint">查看各期週報</span>
        <span class="meta">最新 W48 · 中性偏空 · 謹慎做空</span>
      </a>
    </section>
    <p class="foot">tych3n trading note</p>
  </div>
</body>
</html>
