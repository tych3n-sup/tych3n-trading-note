:root{--deep:#00382A;--night:#00261C;--line-g:#2F5A4C;--sage:#8FA89C;--mist:#A9BDB2;--ivory:#F4F1EA;--champ:#C9A14A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(ellipse at 50% 0%,#00432F 0%,var(--deep) 50%,var(--night) 100%) fixed;background-color:var(--night);color:var(--ivory);font-family:"TT Sans TC",Georgia,serif}
body{padding:36px 22px 64px;padding-top:max(36px,env(safe-area-inset-top));padding-bottom:max(64px,env(safe-area-inset-bottom));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.wrap{width:min(480px,100%);margin:0 auto}
.back{
  display:inline-block;margin-bottom:28px;
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:11px;

body{padding:48px 22px 72px;padding-top:max(48px,env(safe-area-inset-top));padding-bottom:max(72px,env(safe-area-inset-bottom));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.wrap{width:min(440px,100%);margin:0 auto}
.brand{text-align:center;margin-bottom:36px}
.logo{width:86px;height:auto;margin:0 auto 18px;display:block}
.m-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(32px,11vw,44px);letter-spacing:.46em;margin-right:-.46em;line-height:1;color:var(--ivory)}

.acc{margin-top:14px;border:.5px solid var(--champ)}
.acc-btn{
  appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;cursor:pointer;
  min-height:64px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:var(--ivory);text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:rgba(201,161,74,.2);
}
.acc-k{font-family:"TT Serif TC",serif;font-weight:300;font-size:22px;letter-spacing:.12em}
.acc-chev{display:inline-block;width:7px;height:7px;border-right:.9px solid var(--champ);border-bottom:.9px solid var(--champ);transform:rotate(45deg);margin-top:-4px;transition:transform .15s ease;flex:0 0 auto}
.acc-btn[aria-expanded="true"] .acc-chev{transform:rotate(225deg);margin-top:2px}
.acc-panel{border-top:.5px solid var(--line-g);padding:2px 0 8px}
.acc-panel[hidden]{display:none}
.acc-list{list-style:none}
.row{
  display:grid;grid-template-columns:2.6em 1fr;gap:10px;align-items:baseline;

  border-top:.4px solid var(--line-g);
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(201,161,74,.2);
}
.acc-list li:first-child .row{border-top:0}
.row:focus,.row:hover{color:var(--ivory)}
a.row:focus,a.row:hover{background:rgba(201,161,74,.06)}
.row-week{grid-template-columns:3.2em 6.4em 1fr auto;column-gap:8px}

.date{font-family:"Cormorant Garamond",Georgia,serif;color:var(--sage);letter-spacing:.06em;font-size:12px}

.cat-list{list-style:none}

.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.cat-k{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--champ)}
.cat-k-week{letter-spacing:.08em;font-size:12px}
.cat-meta{display:flex;align-items:center;gap:10px;margin-left:auto}

.cat-title{display:block;font-family:"TT Serif TC",serif;font-weight:300;font-size:clamp(19px,5.2vw,23px);letter-spacing:.08em;line-height:1.4;color:var(--ivory);margin:0 0 18px}
.cat-go{display:inline-block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:11px;letter-spacing:.2em;color:var(--champ);border-bottom:.4px solid rgba(201,161,74,.5);padding-bottom:3px}

a.cat:focus,a.cat:hover{background:rgba(201,161,74,.04)}

.more i{font-style:normal;margin-left:5px;letter-spacing:0}

@media(max-width:420px){

  <script>
  (function(){
    var btns=document.querySelectorAll(".acc-btn");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click",function(){
        var open=this.getAttribute("aria-expanded")==="true";
        var panel=document.getElementById(this.getAttribute("aria-controls"));
        this.setAttribute("aria-expanded", open?"false":"true");
        if(panel) panel.hidden=open;
      });
    }
  })();
